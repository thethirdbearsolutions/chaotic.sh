[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaotic-cli"
version = "0.1.0a18"
description = "CLI for Chaotic issue tracking system"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Third Bear Solutions" }
]
keywords = ["cli", "issue-tracker", "project-management", "chaotic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "httpx>=0.26.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    # 2.x API surface (MCPServer) since CHT-1367; the <3 ceiling is
    # load-bearing -- 2.0.0 broke fresh installs when 1.x was unbounded
    # (CHT-1331), so a future major must be adopted deliberately.
    "mcp>=2.1,<3",
    "pyyaml>=6.0",
    # chaotic_mcp_tools bridges the sync httpx client onto the event loop
    # with anyio.to_thread (CHT-1374); already an mcp dependency, pinned
    # here because we import it directly.
    "anyio>=4",
]

[project.urls]
Homepage = "https://chaotic.sh"
Repository = "https://github.com/thethirdbearsolutions/chaotic.sh"
Documentation = "https://chaotic.sh/docs"

[project.scripts]
chaotic = "cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.3",
    "ruff>=0.16.6,<0.17",  # pinned range; see backend/pyproject.toml
]

[tool.hatch.build.targets.wheel]
packages = ["src/cli", "src/chaotic_mcp_tools"]

[tool.hatch.build.targets.sdist]
include = ["src/cli", "src/chaotic_mcp_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

# Pyflakes-equivalent checks only (CHT-1362); see backend/pyproject.toml.
[tool.ruff.lint]
select = ["F401", "F811", "F821", "F841"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]
