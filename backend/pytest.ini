[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_functions = test_*
# -n auto: one worker per core (pytest-xdist, CHT-1413). Each test copies
# its own SQLite file from a per-worker schema template, so workers never
# share a database; pytest-cov combines the workers' coverage before the
# 90% gate. Pass `-n 0` for a serial run: needed for `-s`/print debugging
# (worker stdout is not relayed) and ordering questions; `--pdb` with
# `-n auto` already drops to serial by itself.
addopts = -v -n auto --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=90
