[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaotic-backend"
version = "1.0.0"
description = "Chaotic - Issue tracking backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0,<4.1",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "aiosqlite>=0.19.0",
    "email-validator>=2.1.0",
    "jinja2>=3.1.3",
    "itsdangerous>=2.1.2",
    "oxyde>=0.7.1,<0.8",
    # 2.x API surface (MCPServer) since CHT-1367; the <3 ceiling is
    # load-bearing -- 2.0.0 broke fresh installs when 1.x was unbounded
    # (CHT-1331), so a future major must be adopted deliberately.
    "mcp>=2.1,<3",
    # The shared MCP toolset (chaotic_mcp_tools, CHT-1374) ships inside the
    # chaotic-cli distribution; the backend is only ever installed from this
    # repo checkout with uv, so the path source below is how it gets it.
    # NOTE: a plain `pip install` would resolve this from PyPI instead, and
    # no published chaotic-cli wheel carries chaotic_mcp_tools yet -- add a
    # version floor here with the first CLI release that does.
    "chaotic-cli",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.3",
    # Sharded runs (`-n auto` in pytest.ini, CHT-1413).
    "pytest-xdist>=3.8,<4",
    # Pinned to a compatible range: uv.lock is gitignored, so an unbounded
    # floor would make CI adopt each new ruff release (and its F-rule
    # changes) unreviewed. Bump deliberately.
    "ruff>=0.16.6,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
chaotic-cli = { path = "../cli", editable = true }

# Pyflakes-equivalent checks only (CHT-1362): undefined names, unused
# imports/variables, shadowed redefinitions. Not a style gate. Runs in CI
# (`uv run ruff check .`) and as a pre-commit hook.
[tool.ruff]
# Oxyde's generated model stubs are not ours to lint.
extend-exclude = ["app/oxyde_models/*.pyi", "migrations"]

[tool.ruff.lint]
select = ["F401", "F811", "F821", "F841"]

[tool.ruff.lint.per-file-ignores]
# Tests bind results they never read on purpose (`_ = await ...` would be
# noise); F401/F811/F821 still apply -- F811 is how CHT-1373's ten
# shadowed tests were found.
"tests/*" = ["F841"]
