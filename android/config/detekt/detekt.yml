# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# The ktlint rule set comes from detekt-rules-ktlint-wrapper and reads
# android/.editorconfig.

naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # detekt's default test paths, plus Android's per-variant test sets and
    # Gradle test fixtures (core-sync's CacheStoreContract): a contract or a
    # test class has as many functions as it has cases.
    excludes: ['**/test/**', '**/testDebug/**', '**/testFixtures/**', '**/androidTest/**']

style:
  MagicNumber:
    excludes: ['**/test/**', '**/testDebug/**', '**/testFixtures/**', '**/androidTest/**', '**/*.kts']
    # Preview data is sample numbers.
    ignoreAnnotated: ['Preview']
  ForbiddenImport:
    active: true
    # The generated PATCH models (CHT-1647): every optional field is
    # `val x: T? = null`, and kotlinx.serialization leaves out a value equal
    # to its default, so `IssueUpdate(assigneeId = null)` sends `{}` and can
    # never clear a field. A PATCH body is a JsonObject built by hand, with
    # JsonNull for a field to clear (WriteQueue's UPDATE_ISSUE, sent by
    # ApiRemote.updateIssue). core-api's ChaoticApiTest pins the behaviour.
    forbiddenImports:
      - value: 'sh.chaotic.api.models.*Update'
        reason: 'A generated PATCH model cannot send an explicit null (CHT-1647): send a JsonObject, as ApiRemote.updateIssue does.'
