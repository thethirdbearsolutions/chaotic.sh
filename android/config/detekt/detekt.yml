# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# The ktlint rule set comes from detekt-rules-ktlint-wrapper and reads
# android/.editorconfig.

naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # detekt's default test paths, plus Android's per-variant test sets and
    # Gradle test fixtures (core-sync's CacheStoreContract): a contract or a
    # test class has as many functions as it has cases.
    excludes: ['**/test/**', '**/testDebug/**', '**/testFixtures/**', '**/androidTest/**']

style:
  MagicNumber:
    excludes: ['**/test/**', '**/testDebug/**', '**/testFixtures/**', '**/androidTest/**', '**/*.kts']
    # Preview data is sample numbers.
    ignoreAnnotated: ['Preview']
  ForbiddenImport:
    active: true
    # The generated partial-update models (CHT-1647): the fourteen PATCH
    # bodies, and IssueBatchUpdate (a POST, but a partial update too: it
    # cannot clear an estimate either). They cannot send an explicit null,
    # for two reasons that each suffice: ChaoticApi.json, which the
    # generated client sends with, sets `explicitNulls = false`, so every
    # null property is left out; and each optional field is `T? = null`,
    # which kotlinx.serialization leaves out as a default anyway. So
    # `IssueUpdate(assigneeId = null)` sends `{}` and clears nothing. A
    # PATCH body is a JsonObject built by hand, with JsonNull for a field
    # to clear (WriteQueue's UPDATE_ISSUE, sent by ApiRemote.updateIssue).
    # core-api's ChaoticApiTest pins the generated client's wire body.
    #
    # The rule matches each import's name, so a star import of the models
    # package is refused too: it would bring them in unnamed. A fully
    # qualified use still gets through; review catches that.
    forbiddenImports:
      - value: 'sh.chaotic.api.models.*Update'
        reason: 'A generated partial-update model cannot send an explicit null (CHT-1647): send a JsonObject, as ApiRemote.updateIssue does.'
      - value: 'sh.chaotic.api.models'
        reason: 'Import the generated models by name, so the partial-update ones stay refused (CHT-1647).'
