name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository; third-party actions and the
# downloaded generator get a read-only token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # --locked fails when uv.lock is out of date with pyproject.toml (CHT-1201)
        run: uv sync --locked --extra dev

      - name: Lint (pyflakes rules)
        run: uv run ruff check .

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing -v

  # The CLI suite on its oldest and newest supported Python, plus a run of
  # each test file on its own (CHT-1834). It lives in cli-tests.yml so that
  # publish-cli.yml gates releases on exactly the same jobs. The checks are
  # named "cli / cli (3.10)" and "cli / cli (3.14)".
  cli:
    uses: ./.github/workflows/cli-tests.yml

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # --locked fails when uv.lock is out of date with pyproject.toml (CHT-1201)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Run e2e contract tests
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

  scripts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rolling backup rotation
        run: bash scripts/sqlite-backup.test.sh

      # keytool, for the Android release script's --new-key (CHT-1729).
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # A throwaway key in a temporary HOME: CI never holds the real one.
      - name: Android release script
        run: bash scripts/android-release.test.sh

  # The Android app's generated API client must match the backend's current
  # OpenAPI schema (CHT-1609). A PR that changes a route or schema fails here
  # until it also commits the output of `just android-client`.
  android-api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Read the pinned generator version
        id: generator
        run: |
          echo "version=$(sed -n 's/^GENERATOR_VERSION=//p' android/scripts/generate-api-client.sh)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sed -n 's/^GENERATOR_SHA256=//p' android/scripts/generate-api-client.sh)" >> "$GITHUB_OUTPUT"

      # The script re-verifies the cached jar's SHA-256 on every run and
      # downloads it again if it does not match.
      - name: Cache the generator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/chaotic
          key: openapi-generator-${{ steps.generator.outputs.version }}-${{ steps.generator.outputs.sha256 }}

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Check the committed client is current
        run: android/scripts/generate-api-client.sh --check

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    outputs:
      smoke: ${{ steps.changes.outputs.smoke }}

    steps:
      - uses: actions/checkout@v4

      # Whether android-release-smoke should run: always on main and on a
      # manual run, and on a pull request only when it changes the app or
      # this workflow. HEAD is the merge ref, compared with the base
      # branch's current tip, so a commit that reached main after GitHub
      # built the merge ref can also count (it only ever runs the smoke
      # test more often, never less).
      - name: Does this change the Android app?
        id: changes
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "smoke=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed=$(git diff --name-only FETCH_HEAD HEAD -- android .github/workflows/ci.yml)
          echo "$changed"
          if [ -n "$changed" ]; then echo "smoke=true"; else echo "smoke=false"; fi >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Static analysis (detekt + ktlint rules)
        run: ./gradlew detekt

      # Both flavors; checkDependencies takes :core-api along with each.
      - name: Android lint
        run: ./gradlew :app:lintFossDebug :app:lintPlayDebug

      - name: Unit tests
        id: unit-tests
        run: ./gradlew test

      # ScreenshotsTest (CHT-1730) draws the main screens with sample data
      # during the unit tests above; this keeps the foss flavor's PNGs to
      # look at. They are the test task's declared output, so a run served
      # from the build cache has them too, and none at all is an error.
      - name: Upload screenshots
        if: ${{ !cancelled() && steps.unit-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: android/app/build/screenshots/testFossDebugUnitTest/*.png
          if-no-files-found: error
          retention-days: 14

      # The build above exported the cache's Room schema to app/schemas.
      # It must match the committed copy: a schema change without a version
      # bump rewrites the current version's file, and a bump adds a new
      # file, which has to be committed.
      - name: The committed Room schema is current
        run: |
          # Compared as JSON, so formatting (a final newline) is not a change.
          changed=""
          for f in $(git ls-files --modified -- app/schemas); do
            if ! diff <(git show "HEAD:./$f" | jq -S .) <(jq -S . "$f"); then changed="$changed $f"; fi
          done
          added=$(git ls-files --others --exclude-standard -- app/schemas)
          for f in $added; do echo "--- new file: $f"; cat "$f"; echo; done
          if [ -n "$changed$added" ]; then
            echo "The Room schema changed: bump ChaoticDatabase's version and commit app/schemas." >&2
            exit 1
          fi

      # And a version's committed schema is never edited, only new versions
      # added: editing one by hand would hide a change that kept the version.
      - name: Committed Room schemas are append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          edited=$(git diff --name-status FETCH_HEAD -- app/schemas | grep -v '^A' || true)
          if [ -n "$edited" ]; then
            echo "$edited"
            echo "A committed Room schema was changed or removed: bump ChaoticDatabase's version instead." >&2
            exit 1
          fi

      - name: No non-free dependencies in the foss flavor
        run: ./gradlew :app:checkFossDependencies

      # The negative test for the step above: add a Play Services module, an
      # HMS module and a local jar to the foss flavor and require the check
      # to fail naming each of them.
      - name: The foss check fails on non-free and local dependencies
        run: |
          mkdir -p app/foss-canary && touch app/foss-canary/canary.jar
          if ./gradlew :app:checkFossDependencies -Pchaotic.fossCanary=true > canary.log 2>&1; then
            cat canary.log
            echo "checkFossDependencies passed with non-free dependencies added" >&2
            exit 1
          fi
          for expected in com.google.android.gms:play-services-base "com.huawei.hms:push" "local file canary.jar"; do
            grep -qF "$expected" canary.log || { cat canary.log; echo "the failure did not name $expected" >&2; exit 1; }
          done
          echo "checkFossDependencies rejected all three canaries."

      - name: Assemble both debug flavors
        run: ./gradlew assembleFossDebug assemblePlayDebug

      # The release build type minifies and shrinks with R8 (CHT-1661), so a
      # missing keep or -dontwarn rule only shows up in a release build.
      # Built unsigned: no signing config, so no secrets in CI. --continue
      # lets the other flavor's R8 run too, so one round reports both.
      # Each assemble also runs lintVital for its release variant. That is
      # mostly what the debug lint above already checks, and is kept on
      # purpose: it is the only lint that would see a release-only source
      # set or manifest, should one be added.
      - name: Assemble both release flavors (R8)
        id: release
        run: ./gradlew --continue assembleFossRelease assemblePlayRelease

      - name: Keep the release APKs for the smoke test
        if: steps.changes.outputs.smoke == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: android/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          # Long enough to re-run only the smoke job over a weekend.
          retention-days: 3
          # A re-run of this job uploads again under the same name.
          overwrite: true

      - name: Rules R8 asked for, if the release build failed
        if: failure() && steps.release.outcome == 'failure'
        run: |
          for f in app/build/outputs/mapping/*/missing_rules.txt; do
            [ -f "$f" ] && { echo "--- $f"; cat "$f"; }
          done
          true

  # Launches each minified release APK once on an emulator (CHT-1723). The
  # build above only proves R8 found every class it was told about; a class
  # reached only by reflection that R8 stripped or renamed crashes at run
  # time instead. The script signs a copy of each unsigned APK with a key it
  # makes and throws away, installs it, and waits for the sign-in screen.
  #
  # The emulator sometimes stops answering mid-run (CHT-1836: twice an
  # adb install or launch of the second APK never returned, and the job sat
  # until its timeout). The script gives every adb call its own time limit
  # and says which one ran out; a stuck or vanished device, or an emulator
  # that does not boot, gets one retry on a fresh emulator, and a green job
  # that needed it shows a warning. A failure of the app itself is not
  # retried, and that includes a launch that never reports while the device
  # still answers: a retry could pass by luck and hide a startup hang.
  android-release-smoke:
    needs: android
    if: needs.android.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Only the script is needed; the token stays out of .git/config while
      # the third-party emulator action runs.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: release-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # v2.38.0, pinned by commit: a third-party action that runs with the
      # job's token.
      # The script creates SMOKE_NO_RETRY_MARKER only when it gives up for a
      # reason a retry would not fix (exit 1 or 2). A stuck device (exit 3),
      # a boot that times out and a step killed at its timeout-minutes leave
      # no marker and get the retry. SMOKE_STUCK_LOG collects exit 3's reason.
      - name: Launch each release APK on an emulator
        id: smoke
        continue-on-error: true
        timeout-minutes: 1
        env:
          SMOKE_NO_RETRY_MARKER: ${{ github.workspace }}/smoke-no-retry
          SMOKE_STUCK_LOG: ${{ github.workspace }}/smoke-stuck.log
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: android/scripts/release-smoke-test.sh $(find release-apks -name '*-release-unsigned.apk' | sort)

      - name: Failed for a reason a retry would not fix
        if: steps.smoke.outcome != 'success' && hashFiles('smoke-no-retry') != ''
        run: |
          echo "::error::The release smoke test failed for a reason a retry would not fix (the app, an APK, or the script's arguments), not a stuck emulator; see the step above."
          exit 1

      # The action starts the emulator in the background, so one whose step
      # hit its timeout is still running, and the adb server may be the part
      # that is wedged. Kill both outright (a polite kill-server would wait
      # on a wedged server) and wait for qemu to go. The retry also uses its
      # own AVD and port in case anything lingers (the action points the
      # script's adb at it through ANDROID_SERIAL).
      - name: Stop the first emulator
        if: steps.smoke.outcome != 'success'
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          timeout 10 "$adb" -s emulator-5554 emu kill || true
          pkill -9 -x adb || true
          pkill -9 -f 'qemu-system-x86_64' || true
          pkill -9 -x emulator || true
          for _ in $(seq 15); do
            pgrep -f 'qemu-system-x86_64' > /dev/null || break
            sleep 1
          done
          pgrep -af 'qemu-system|adb' || echo "no emulator or adb left"

      - name: Retry on a fresh emulator (the first one stopped answering)
        id: retry
        if: steps.smoke.outcome != 'success'
        timeout-minutes: 10
        env:
          SMOKE_STUCK_LOG: ${{ github.workspace }}/smoke-stuck.log
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 300
          avd-name: retry
          emulator-port: 5556
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: android/scripts/release-smoke-test.sh $(find release-apks -name '*-release-unsigned.apk' | sort)

      # A green job that needed the retry says so where it will be seen.
      - name: Passed on the retry
        if: steps.smoke.outcome != 'success' && steps.retry.outcome == 'success'
        run: |
          reason="it did not finish (the boot timed out, or the step hit its timeout)"
          if [ -s smoke-stuck.log ]; then reason=$(head -n 1 smoke-stuck.log); fi
          echo "::warning::The release smoke test passed only on its retry. First attempt: $reason"
