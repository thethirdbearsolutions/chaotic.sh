name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # --locked fails when uv.lock is out of date with pyproject.toml (CHT-1201)
        run: uv sync --locked --extra dev

      - name: Lint (pyflakes rules)
        run: uv run ruff check .

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing -v

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # --locked fails when uv.lock is out of date with pyproject.toml (CHT-1201)
        run: uv sync --locked --extra dev

      - name: Lint (pyflakes rules)
        run: uv run ruff check .

      - name: Run tests with coverage
        run: uv run pytest --cov=cli --cov=chaotic_mcp_tools --cov-report=term-missing -v

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # --locked fails when uv.lock is out of date with pyproject.toml (CHT-1201)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Run e2e contract tests
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

  scripts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rolling backup rotation
        run: bash scripts/sqlite-backup.test.sh

  # The Android app's generated API client must match the backend's current
  # OpenAPI schema (CHT-1609). A PR that changes a route or schema fails here
  # until it also commits the output of `just android-client`.
  android-api-client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Check the committed client is current
        run: android/scripts/generate-api-client.sh --check

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Static analysis (detekt + ktlint rules)
        run: ./gradlew detekt

      - name: Android lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew test

      - name: No non-free dependencies in the foss flavor
        run: ./gradlew :app:checkFossDependencies

      - name: Assemble both debug flavors
        run: ./gradlew assembleFossDebug assemblePlayDebug
