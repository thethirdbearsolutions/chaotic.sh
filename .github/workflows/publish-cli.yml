name: Publish CLI to PyPI

# How this publishes (CHT-1356). Both publish jobs try, in order:
#   1. an API token, if the environment defines the PYPI_API_TOKEN /
#      TEST_PYPI_API_TOKEN secret (what the out-of-band a16/a18 uploads used);
#   2. otherwise PyPI trusted publishing (OIDC). For that to work the PyPI
#      project must list a trusted publisher matching EXACTLY these claims,
#      which is what every run so far has failed on ("invalid-publisher"):
#        owner: thethirdbearsolutions   repository: chaotic.sh
#        workflow: publish-cli.yml      environment: pypi   (test-pypi on TestPyPI)
# The TestPyPI job is a smoke test and cannot block the real publish: a17
# never shipped because publish-pypi `needs`ed a TestPyPI job that failed.
# Nothing `needs` it now, so its failure is visible on the run but gates
# nothing. Note the token path has no safety net: a secret that is SET but
# invalid or expired fails the upload outright; only an empty secret falls
# back to OIDC.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -v

  test-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    needs: [test-backend, test-cli, test-frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cli/dist/

  publish-test-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    # Smoke test only: nothing `needs` this job, so its failure cannot decide
    # whether the real publish runs (CHT-1356), and it stays visible as a
    # failed job rather than being hidden by continue-on-error.

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Empty when the secret is unset, which makes the action fall back
          # to trusted publishing (OIDC).
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

  publish-pypi:
    # Deliberately NOT `needs: publish-test-pypi`: the smoke publish is
    # informational. Only a green build gates the release.
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty when the secret is unset, which makes the action fall back
          # to trusted publishing (OIDC); see the header comment for the
          # publisher claims PyPI must be configured with.
          password: ${{ secrets.PYPI_API_TOKEN }}
