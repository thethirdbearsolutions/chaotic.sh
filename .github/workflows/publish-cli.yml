name: Publish CLI to PyPI

# How this publishes (CHT-1356). Both publish jobs try, in order:
#   1. an API token, if the environment defines the PYPI_API_TOKEN /
#      TEST_PYPI_API_TOKEN secret (what the out-of-band a16/a18 uploads used);
#   2. otherwise PyPI trusted publishing (OIDC). For that to work the PyPI
#      project must list a trusted publisher matching EXACTLY these claims,
#      which is what every run so far has failed on ("invalid-publisher"):
#        owner: thethirdbearsolutions   repository: chaotic.sh
#        workflow: publish-cli.yml      environment: pypi   (test-pypi on TestPyPI)
# The TestPyPI job is a smoke test and cannot block the real publish: a17
# never shipped because publish-pypi `needs`ed a TestPyPI job that failed.
# Nothing `needs` it now, so its failure is visible on the run but gates
# nothing. Note the token path has no safety net: a secret that is SET but
# invalid or expired fails the upload outright; only an empty secret falls
# back to OIDC.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per tag: a global group keeps only one pending run, so a burst
  # of releases would silently drop all but the last.
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-backend:
    # Only a CLI release (a v* tag). The Android app's releases are tagged
    # android-v* (scripts/android-release.sh, CHT-1729) and publish nothing here.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest -v

  test-cli:
    # Only a CLI release: see test-backend.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    # The same jobs as ci.yml's cli check (CHT-1834): the matrix of the oldest
    # and newest supported Python, and each test file run on its own.
    uses: ./.github/workflows/cli-tests.yml

  test-frontend:
    # Only a CLI release: see test-backend.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    # Skipped with the test jobs on an Android release (their `if`), so a
    # release tagged android-v* never reaches the tag check below.
    needs: [test-backend, test-cli, test-frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Check the tag matches the package version
        # skip-existing (below) would turn a tag/version mismatch into a green
        # run that publishes nothing, so refuse it here. Only real publishes
        # (a release, or a dispatch from a v* tag) can reach PyPI at all.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::Tag $REF_NAME does not match cli/pyproject.toml version $version"
              exit 1
            fi
          fi
          echo "Building chaotic-cli $version"

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cli/dist/

  publish-test-pypi:
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    # Smoke test only: nothing `needs` this job, so its failure cannot decide
    # whether the real publish runs (CHT-1356), and it stays visible as a
    # failed job rather than being hidden by continue-on-error.

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Empty when the secret is unset, which makes the action fall back
          # to trusted publishing (OIDC).
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          # Re-running a release must not fail on files already there. (A
          # release event runs the workflow file from the tagged commit, so
          # tags made before this change don't have this.)
          skip-existing: true

  publish-pypi:
    # Deliberately NOT `needs: publish-test-pypi`: the smoke publish is
    # informational. Only a green build gates the release.
    needs: build
    # Never publish a branch build to PyPI (a dispatch from a feature branch
    # once tried to): only a release or a dispatch from a v* tag.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Note a version that is already on PyPI
        # With skip-existing a re-run publishes nothing and still goes green;
        # say so on the run instead of letting it look like a fresh publish.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          if curl -fsS -o /dev/null "https://pypi.org/pypi/chaotic-cli/$version/json"; then
            echo "::notice::chaotic-cli $version is already on PyPI; files already there will be skipped, only missing ones uploaded."
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty when the secret is unset, which makes the action fall back
          # to trusted publishing (OIDC); see the header comment for the
          # publisher claims PyPI must be configured with.
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A re-run, or a version already uploaded by hand, is skipped rather
          # than failing with "file exists". Tags made before this change run
          # their own copy of this file and don't have it.
          skip-existing: true
