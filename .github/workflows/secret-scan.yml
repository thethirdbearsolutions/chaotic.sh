name: Secret scan

# The repository is public, so anything committed is published, and a
# hosted Chaotic holds client data (CHT-1733). This fails a push or PR
# whose new commits contain something gitleaks reads as a credential.
# Known fixtures (RFC 8291 test vectors, placeholder keys) are listed by
# fingerprint in .gitleaksignore.
#
# This catches accidents, not a hostile contributor: the commits under
# scan carry their own .gitleaksignore, .gitleaks.toml and
# `gitleaks:allow` comments, which gitleaks honours. Review any PR that
# touches those as closely as code. It also runs only after a push has
# already published the commits; GitHub's secret scanning with push
# protection is what stops a secret before it lands. Merge commits carry
# no diff under `git log -p`, so a secret introduced while resolving a
# conflict is not seen here.

on:
  # Every branch: in a public repository a pushed branch is published
  # whether or not it ever gets a PR.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz

      # A PR scans the commits it adds; a push scans what it brought in.
      # A new branch, or a force-push whose old head is no longer
      # fetched, has no usable base, so it scans everything reachable
      # from the pushed commit (about ten seconds). A manual run scans
      # every fetched branch and tag (--all).
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                range="$PUSH_BEFORE..$PUSH_AFTER"
              else
                range="$PUSH_AFTER"
              fi ;;
            *) range="--all" ;;
          esac
          ./gitleaks git --redact --no-banner --log-opts="$range" .
