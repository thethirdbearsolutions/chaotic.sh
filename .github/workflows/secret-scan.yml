name: Secret scan

# The repository is public, so anything committed is published, and a
# hosted Chaotic holds client data (CHT-1733). This fails a push or PR
# whose new commits contain something gitleaks reads as a credential.
# Known fixtures (RFC 8291 test vectors, placeholder keys) are listed by
# fingerprint in .gitleaksignore.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
      GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz

      # A PR scans the commits it adds; a push to main scans what it
      # brought in; a manual run scans the whole history.
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
                range="$PUSH_AFTER"
              else
                range="$PUSH_BEFORE..$PUSH_AFTER"
              fi ;;
            *) range="--all" ;;
          esac
          ./gitleaks git --redact --no-banner --log-opts="$range" .
